name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/test_db

jobs:
  # 🔍 QUALITY GATES - Análise de Qualidade
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 ESLint - Code Quality
        run: pnpm run lint
        continue-on-error: true

      - name: 🎨 Prettier - Code Formatting
        run: pnpm run format:check
        continue-on-error: true

      - name: 🔒 Security Audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: 📊 TypeScript Check
        run: pnpm run type-check

  # 🧪 UNIT TESTS - Testes Unitários
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PPNM_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Setup Database
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
        working-directory: packages/prisma

      - name: 🌱 Seed Test Data
        run: node scripts/test-seed.js --type all --count 5
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: 🧪 Run Unit Tests (Backend)
        run: pnpm test:unit -- --coverage --watchAll=false
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: redis://localhost:6380

      - name: 🧪 Run Unit Tests (Frontend)
        run: pnpm test:unit -- --coverage --watchAll=false --passWithNoTests
        working-directory: apps/dashboard

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # 🔗 INTEGRATION TESTS - Testes de Integração
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Setup Database
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
        working-directory: packages/prisma

      - name: 🌱 Seed Test Data
        run: node scripts/test-seed.js --type all --count 10
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: 🔗 Run Integration Tests
        run: pnpm test:integration -- --coverage --watchAll=false
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: redis://localhost:6380

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          flags: integration
          name: codecov-umbrella
          fail_ci_if_error: false

  # 🌐 E2E TESTS - Testes End-to-End
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Setup Database
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
        working-directory: packages/prisma

      - name: 🌱 Seed Test Data
        run: node scripts/test-seed.js --type all --count 15
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: 🚀 Start API Server
        run: |
          pnpm build
          pnpm start &
          sleep 10
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: redis://localhost:6380
          PORT: 3002

      - name: 🚀 Start Dashboard
        run: |
          pnpm build
          pnpm start &
          sleep 10
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3002

      - name: 🌐 Run E2E Tests (Cypress)
        run: pnpm test:e2e:ci
        working-directory: apps/dashboard
        env:
          CYPRESS_BASE_URL: http://localhost:3000

      - name: 📊 Upload Cypress Screenshots
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-screenshots
          path: apps/dashboard/cypress/screenshots/

      - name: 📊 Upload Cypress Videos
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cypress-videos
          path: apps/dashboard/cypress/videos/

  # 📈 PERFORMANCE TESTS - Testes de Performance
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Setup Database
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
        working-directory: packages/prisma

      - name: 🌱 Seed Test Data
        run: node scripts/test-seed.js --type all --count 20
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: 🚀 Build and Start Application
        run: |
          pnpm build
          pnpm start &
          sleep 15
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3002

      - name: 🚀 Start API Server
        run: |
          pnpm build
          pnpm start &
          sleep 15
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: redis://localhost:6380
          PORT: 3002

      - name: 📈 Lighthouse Performance Audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/dashboard
            http://localhost:3000/login
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: 📊 Upload Lighthouse Results
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-results
          path: .lighthouseci/

  # 📊 COVERAGE REPORT - Relatório de Cobertura
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Download Coverage Artifacts
        uses: actions/download-artifact@v3
        with:
          name: coverage-*

      - name: 📈 Generate Coverage Report
        run: |
          npx nyc report --reporter=text --reporter=html
          npx nyc check-coverage --lines 80 --functions 80 --branches 75 --statements 80

      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/

  # 🚀 DEPLOY STAGING - Deploy para Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality-gate, unit-tests, integration-tests, e2e-tests, performance-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Application
        run: pnpm build

      - name: 🚀 Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # Example: rsync, docker push, etc.

      - name: ✅ Health Check
        run: |
          curl -f https://staging.sistema-laura.com/health || exit 1

  # 🎯 DEPLOY PRODUCTION - Deploy para Produção
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Application
        run: pnpm build

      - name: 🚀 Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here

      - name: ✅ Production Health Check
        run: |
          curl -f https://sistema-laura.com/health || exit 1

      - name: 📢 Notify Deployment
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🚀 Sistema Laura deployed to production!"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
