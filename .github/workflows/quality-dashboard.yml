name: Quality Dashboard

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Executar diariamente às 6:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  generate-quality-dashboard:
    name: Generate Quality Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PPNM_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 🧪 Run Unit Tests with Coverage
        run: |
          pnpm test:unit -- --coverage
          pnpm test:unit -- --coverage
        working-directory: apps/api

      - name: 🧪 Run Frontend Tests with Coverage
        run: pnpm test:unit -- --coverage
        working-directory: apps/dashboard

      - name: 📊 Generate Quality Dashboard
        run: node scripts/generate-quality-dashboard.js

      - name: 📊 Upload Quality Dashboard
        uses: actions/upload-artifact@v3
        with:
          name: quality-dashboard
          path: quality-dashboard/

      - name: 📊 Upload Coverage Reports
        uses: actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
            coverage/

  update-readme-badges:
    name: Update README Badges
    runs-on: ubuntu-latest
    needs: generate-quality-dashboard
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Download Quality Dashboard
        uses: actions/download-artifact@v3
        with:
          name: quality-dashboard
          path: quality-dashboard/

      - name: 📊 Update README with Badges
        run: |
          # Ler dados dos badges
          if [ -f "quality-dashboard/badges.json" ]; then
            COVERAGE_BADGE=$(jq -r '.coverage' quality-dashboard/badges.json)
            QUALITY_BADGE=$(jq -r '.quality' quality-dashboard/badges.json)
            SECURITY_BADGE=$(jq -r '.security' quality-dashboard/badges.json)
            PERFORMANCE_BADGE=$(jq -r '.performance' quality-dashboard/badges.json)
            OVERALL_BADGE=$(jq -r '.overall' quality-dashboard/badges.json)

            # Atualizar README.md
            sed -i "s|!\[Coverage\](.*)|![Coverage]($COVERAGE_BADGE)|g" README.md
            sed -i "s|!\[Quality\](.*)|![Quality]($QUALITY_BADGE)|g" README.md
            sed -i "s|!\[Security\](.*)|![Security]($SECURITY_BADGE)|g" README.md
            sed -i "s|!\[Performance\](.*)|![Performance]($PERFORMANCE_BADGE)|g" README.md
            sed -i "s|!\[Overall\](.*)|![Overall]($OVERALL_BADGE)|g" README.md
          fi

      - name: 📝 Commit Badge Updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add README.md
          git commit -m "docs: update quality badges [skip ci]" || echo "No changes to commit"

          git push origin main || echo "No changes to push"

  deploy-dashboard:
    name: Deploy Quality Dashboard
    runs-on: ubuntu-latest
    needs: generate-quality-dashboard
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Download Quality Dashboard
        uses: actions/download-artifact@v3
        with:
          name: quality-dashboard
          path: quality-dashboard/

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./quality-dashboard
          destination_dir: quality-dashboard
          cname: quality.sistema-laura.com
